# Production variant of docker-compose.yml for Coolify (Docker Compose build
# pack, base directory /nakama-server) - see docs/DEPLOY_COOLIFY.md.
#
# Differences from the local-dev file:
#   - no `ports:` - nothing binds host ports; Coolify's proxy routes the
#     domain you assign to the nakama service (container port 7350) and
#     terminates TLS, so clients connect on 443 (https / wss).
#   - no `container_name:` - fixed names clash with Coolify's own naming and
#     with any other stack on the same server (e.g. SuperShips).
#   - every secret is required. Coolify lists each ${VAR} as a variable to
#     fill in, and nakama's entrypoint refuses to start (naming the missing
#     setting) if any is empty, instead of running on Nakama's well-known
#     defaults. The check is in the entrypoint, not `${VAR}` here, because
#     Coolify runs `docker compose build` for the nakama image and compose
#     would then demand every variable at build time too; this way none of
#     them needs "Available at Buildtime" and no secret is passed to the build.
#   - the runtime modules are baked into the nakama image (./Dockerfile)
#     instead of bind-mounted: Coolify doesn't keep the repository on the
#     host, so a `./` mount there is an empty folder and no modules load.
services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      - POSTGRES_DB=nakama
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 5
  nakama:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # Must equal the NAKAMA_SERVER_KEY build variable of the web app.
      - NAKAMA_SERVER_KEY=${NAKAMA_SERVER_KEY}
      - NAKAMA_CONSOLE_USERNAME=${NAKAMA_CONSOLE_USERNAME}
      - NAKAMA_CONSOLE_PASSWORD=${NAKAMA_CONSOLE_PASSWORD}
      - NAKAMA_CONSOLE_SIGNING_KEY=${NAKAMA_CONSOLE_SIGNING_KEY}
      - NAKAMA_SESSION_ENCRYPTION_KEY=${NAKAMA_SESSION_ENCRYPTION_KEY}
      - NAKAMA_REFRESH_ENCRYPTION_KEY=${NAKAMA_REFRESH_ENCRYPTION_KEY}
      - NAKAMA_HTTP_KEY=${NAKAMA_HTTP_KEY}
      # Play tokens from the website (modules/auth.lua): the secret and slug
      # printed by `php artisan galaxy:server <slug> ...` on the website.
      - PLAY_TOKEN_SECRET=${PLAY_TOKEN_SECRET}
      - SERVER_ID=${SERVER_ID}
      # Signs star-system transfer tickets (modules/tickets.lua). Generate a
      # long random value; every Nakama node must share it.
      - TICKET_SECRET=${TICKET_SECRET}
      # This node's name and the public host clients use for its matches.
      # PUBLIC_ENDPOINT stays empty while there's a single node.
      - NODE_ID=${NODE_ID:-node1}
      - PUBLIC_ENDPOINT=${PUBLIC_ENDPOINT:-}
    entrypoint:
      - "/bin/sh"
      # -e only, not -x: tracing would print every secret below into the logs.
      - "-ec"
      - >
          for v in POSTGRES_PASSWORD NAKAMA_SERVER_KEY NAKAMA_CONSOLE_USERNAME NAKAMA_CONSOLE_PASSWORD
          NAKAMA_CONSOLE_SIGNING_KEY NAKAMA_SESSION_ENCRYPTION_KEY NAKAMA_REFRESH_ENCRYPTION_KEY
          NAKAMA_HTTP_KEY PLAY_TOKEN_SECRET SERVER_ID TICKET_SECRET; do
          eval "val=\$$$$v"; if [ -z "$$val" ]; then echo "galaxy-server: required setting $$v is empty - set it in Coolify" >&2; exit 1; fi;
          done;
          /nakama/nakama migrate up --database.address postgres:$$POSTGRES_PASSWORD@postgres:5432/nakama &&
          exec /nakama/nakama --name nakama1
          --database.address postgres:$$POSTGRES_PASSWORD@postgres:5432/nakama
          --logger.level INFO
          --session.token_expiry_sec 7200
          --session.encryption_key "$$NAKAMA_SESSION_ENCRYPTION_KEY"
          --session.refresh_encryption_key "$$NAKAMA_REFRESH_ENCRYPTION_KEY"
          --socket.server_key "$$NAKAMA_SERVER_KEY"
          --runtime.http_key "$$NAKAMA_HTTP_KEY"
          --runtime.env "PLAY_TOKEN_SECRET=$$PLAY_TOKEN_SECRET"
          --runtime.env "SERVER_ID=$$SERVER_ID"
          --runtime.env "TICKET_SECRET=$$TICKET_SECRET"
          --runtime.env "NODE_ID=$$NODE_ID"
          --runtime.env "PUBLIC_ENDPOINT=$$PUBLIC_ENDPOINT"
          --console.username "$$NAKAMA_CONSOLE_USERNAME"
          --console.password "$$NAKAMA_CONSOLE_PASSWORD"
          --console.signing_key "$$NAKAMA_CONSOLE_SIGNING_KEY"
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "7350" # client API + realtime socket - give this a domain in Coolify
      - "7351" # admin console - only give this a domain if you need it
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  data:
