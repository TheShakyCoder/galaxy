# Production variant of docker-compose.yml for Coolify (Docker Compose build
# pack, base directory /nakama-server) - see docs/DEPLOY_COOLIFY.md.
#
# Differences from the local-dev file:
#   - no `ports:` - nothing binds host ports; Coolify's proxy routes the
#     domain you assign to the nakama service (container port 7350) and
#     terminates TLS, so clients connect on 443 (https / wss).
#   - no `container_name:` - fixed names clash with Coolify's own naming and
#     with any other stack on the same server (e.g. SuperShips).
#   - every secret is required (`:?`), so Coolify lists them as variables to
#     fill in and a deploy with one missing fails instead of running on
#     Nakama's well-known defaults.
services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      - POSTGRES_DB=nakama
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
    volumes:
      - data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 5
  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.37.0
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      # Must equal the NAKAMA_SERVER_KEY build variable of the web app.
      - NAKAMA_SERVER_KEY=${NAKAMA_SERVER_KEY:?}
      - NAKAMA_CONSOLE_USERNAME=${NAKAMA_CONSOLE_USERNAME:?}
      - NAKAMA_CONSOLE_PASSWORD=${NAKAMA_CONSOLE_PASSWORD:?}
      - NAKAMA_CONSOLE_SIGNING_KEY=${NAKAMA_CONSOLE_SIGNING_KEY:?}
      - NAKAMA_SESSION_ENCRYPTION_KEY=${NAKAMA_SESSION_ENCRYPTION_KEY:?}
      - NAKAMA_REFRESH_ENCRYPTION_KEY=${NAKAMA_REFRESH_ENCRYPTION_KEY:?}
      - NAKAMA_HTTP_KEY=${NAKAMA_HTTP_KEY:?}
      # Email verification codes (modules/accounts.lua), sent through Resend.
      # Required here so production can never fall back to logging codes.
      - RESEND_API_KEY=${RESEND_API_KEY:?}
      - EMAIL_FROM=${EMAIL_FROM:?}
    entrypoint:
      - "/bin/sh"
      # -e only, not -x: tracing would print every secret below into the logs.
      - "-ec"
      - >
          /nakama/nakama migrate up --database.address postgres:$$POSTGRES_PASSWORD@postgres:5432/nakama &&
          exec /nakama/nakama --name nakama1
          --database.address postgres:$$POSTGRES_PASSWORD@postgres:5432/nakama
          --logger.level INFO
          --session.token_expiry_sec 7200
          --session.encryption_key "$$NAKAMA_SESSION_ENCRYPTION_KEY"
          --session.refresh_encryption_key "$$NAKAMA_REFRESH_ENCRYPTION_KEY"
          --socket.server_key "$$NAKAMA_SERVER_KEY"
          --runtime.http_key "$$NAKAMA_HTTP_KEY"
          --runtime.env "RESEND_API_KEY=$$RESEND_API_KEY"
          --runtime.env "EMAIL_FROM=$$EMAIL_FROM"
          --console.username "$$NAKAMA_CONSOLE_USERNAME"
          --console.password "$$NAKAMA_CONSOLE_PASSWORD"
          --console.signing_key "$$NAKAMA_CONSOLE_SIGNING_KEY"
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/nakama/data
    expose:
      - "7350" # client API + realtime socket - give this a domain in Coolify
      - "7351" # admin console - only give this a domain if you need it
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  data:
