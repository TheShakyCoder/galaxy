services:
  postgres:
    container_name: postgres
    image: postgres:16.8-alpine
    # POSTGRES_PASSWORD defaults to "localdb" for local dev if unset -
    # override it via .env for any real deployment (see .env.example). Not
    # published to the host at all (see `expose:` only, no `ports:`
    # mapping) - only the nakama container, on this same compose network,
    # ever needs to reach it. Matters once this runs somewhere other than
    # localhost (e.g. a real deployment): a plaintext local-dev password
    # on a port open to the internet is a real risk, not hypothetical.
    environment:
      - POSTGRES_DB=nakama
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-localdb}
    volumes:
      - data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 5
  nakama:
    container_name: nakama
    image: registry.heroiclabs.com/heroiclabs/nakama:3.37.0
    # Players sign in with play tokens from the website (Laravel); see
    # modules/auth.lua. No other sign-in methods are allowed.
    environment:
      # Same default/override as postgres's own POSTGRES_PASSWORD above -
      # must match it exactly (this is the password Nakama itself uses to
      # connect to postgres), which is why both read from the same
      # POSTGRES_PASSWORD env var rather than being set independently.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-localdb}
      # Play tokens from the website (modules/auth.lua). Must match the local
      # website's game server row: php artisan galaxy:server local ...
      - PLAY_TOKEN_SECRET=${PLAY_TOKEN_SECRET:-local-dev-play-token-secret}
      - SERVER_ID=${SERVER_ID:-local}
      # Server-to-server calls from the website (modules/players.lua).
      - NAKAMA_HTTP_KEY=${NAKAMA_HTTP_KEY:-local-dev-http-key}
      # Star-system matches (modules/directory.lua, tickets.lua, registry.lua).
      - TICKET_SECRET=${TICKET_SECRET:-local-dev-ticket-secret}
      - NODE_ID=${NODE_ID:-node1}
      - PUBLIC_ENDPOINT=${PUBLIC_ENDPOINT:-}
    entrypoint:
      - "/bin/sh"
      # -e only, not -x: tracing would print the secrets into the logs.
      - "-ec"
      - >
          /nakama/nakama migrate up --database.address postgres:$$POSTGRES_PASSWORD@postgres:5432/nakama &&
          exec /nakama/nakama --name nakama1 --database.address postgres:$$POSTGRES_PASSWORD@postgres:5432/nakama --logger.level DEBUG --session.token_expiry_sec 7200 --runtime.http_key "$$NAKAMA_HTTP_KEY" --runtime.env "PLAY_TOKEN_SECRET=$$PLAY_TOKEN_SECRET" --runtime.env "SERVER_ID=$$SERVER_ID" --runtime.env "TICKET_SECRET=$$TICKET_SECRET" --runtime.env "NODE_ID=$$NODE_ID" --runtime.env "PUBLIC_ENDPOINT=$$PUBLIC_ENDPOINT"
    restart: always
    links:
      - "postgres:db"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/nakama/data
    expose:
      - "7349"
      - "7350"
      - "7351"
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  data:
